<html lang="en">
<head >
    <title>Task Heading</title>
    <link href="index.css" rel="stylesheet">
    <link rel="stylesheet" href="indextwo.css">
</head>
<body>
    <div class="chat-bar">
        <!-- Left Icon Actions -->
       
        <div class="action-icons">
          <!-- Plus in circle -->
          <button class="icon-btn" aria-label="Add action">
            <svg viewBox="0 0 24 24">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
            </svg>
          </button>
    
          <!-- GIF badge -->
          <button class="icon-btn" aria-label="Choose a GIF">
            <svg viewBox="0 0 24 24">
              <rect x="2" y="4" width="20" height="16" rx="5" ry="5"/>
              <path fill="#ffffff" d="M9 10.2H6.8v3.6h1.3v-1.4h.9v-.8h-.9v-.7H9v-.7zm2.5 4.3h-1.3V9.5h1.3v5zm5-.7c-.3.5-.9.8-1.5.8-1.2 0-2-.9-2-2.1s.8-2.1 2-2.1c.8 0 1.3.4 1.6.9l-1 .6c-.1-.2-.3-.4-.6-.4-.5 0-.8.4-.8 1s.3 1 .8 1c.3 0 .4-.1.5-.2v-.5h-.7V11h1.7v2.8z"/>
            </svg>
          </button>
    
          <!-- Sticker / folded card -->
          <button class="icon-btn" aria-label="Choose a sticker">
            <svg viewBox="0 0 24 24">
              <path d="M5 3h14a2 2 0 0 1 2 2v10a1 1 0 0 1-.293.707l-5.707 5.707A1 1 0 0 1 14.293 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm9 16.586L19.586 14H15a1 1 0 0 0-1 1v4.586z"/>
            </svg>
          </button>
    
          <!-- Image / photo -->
          <button class="icon-btn" aria-label="Attach a photo">
            <svg viewBox="0 0 24 24">
              <path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-10 4a2 2 0 1 1-2 2 2 2 0 0 1 2-2zm10 12H5l4-5.33 3 4 3-2.67L19 19z"/>
            </svg>
          </button>
        </div>
    
        <!-- Rounded Input Field -->
        <div class="input-wrapper">
          <input type="text" placeholder="Type a message...">
          <!-- Emoji icon inside pill -->
          <button class="icon-btn emoji-btn" aria-label="Insert emoji">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <!-- Eyes -->
              <circle cx="8.5" cy="10" r="1.2" fill="#ffffff"/>
              <circle cx="15.5" cy="10" r="1.2" fill="#ffffff"/>
              <!-- Smile -->
              <path fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" d="M8 14.2c1.2 1.8 4.8 1.8 6 0"/>
            </svg>
          </button>
        </div>
    
        <!-- Thumbs-up / Like Button -->
        <button class="icon-btn" aria-label="Send like">
          <svg viewBox="0 0 24 24">
            <path d="M2 20h2c.55 0 1-.45 1-1v-9c0-.55-.45-1-1-1H2v11zm19.83-7.12c.11-.25.17-.52.17-.8V11c0-1.1-.9-2-2-2h-5.5l.92-4.65c.05-.22.02-.46-.08-.66-.23-.45-.7-.73-1.21-.73-.42 0-.82.17-1.11.46L8.5 7.5c-.32.32-.5.76-.5 1.22V19c0 1.1.9 2 2 2h7.35c.82 0 1.55-.5 1.86-1.26l2.62-6.86z"/>
          </svg>
        </button>
       
      </div>
    </main>
    
    </body>
</body>
</html>
