<html lang="en">
<head >
    <title>Task 1 Results Card</title>
    <link href="index.css" rel="stylesheet">
</head>
<body>
   
        <div class="card">
            <!-- Left Side: Result -->
            <div class="panel-left">
              <h3 class="result-title">Your Result</h3>
          
              <div class="score-circle">
                <div class="score-circle-content">
                  <span class="score-num">76</span>
                  <span class="score-total">of 100</span>
                </div>
              </div>
          
              <div class="result-feedback">
                <h2 class="feedback-heading">Great</h2>
                <p class="feedback-text">
                  You scored higher than 65% of the people who have taken these tests.
                </p>
              </div>
            </div>
          
            <!-- Right Side: Summary -->
            <div class="panel-right">
              <h3 class="summary-title">Summary</h3>
          
              <div class="summary-list">
                <div class="stat-row row-reaction">
                <img src="./assets/lightning.png" alt=" lightning">
                  <span class="stat-label"> Reaction</span>
                  <span class="stat-value"><strong>80</strong> / 100</span>
                </div>
          
                <div class="stat-row row-memory">
                <img src="./assets/brain.png" alt="Brain">
                  <span class="stat-label"> Memory</span>
                  <span class="stat-value"><strong>92</strong> / 100</span>
                </div>
          
                <div class="stat-row row-verbal">
                <img src="./assets/chat.png" alt="eye">
                  <span class="stat-label"> Verbal</span>
                  <span class="stat-value"><strong>61</strong> / 100</span>
                </div>
          
                <div class="stat-row row-visual">
                <img src="./assets/eye.png" alt="visual">
                  <span class="stat-label"> Visual</span>
                  <span class="stat-value"><strong>73</strong> / 100</span>
                </div>
              </div>
          
              <button class="btn-continue">Continue</button>
            </div>
          </div>
</body>
</html>
