<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery 2</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="gallery-container">
        <!-- Top Row (5 items) -->
        <div class="card">
            <img src="https://picsum.photos/id/1018/600/450" alt="Coastline view">
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1043/600/450" alt="Forest trail">
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1015/600/450" alt="Bay from above">
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1071/600/450" alt="Street rickshaw">
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1053/600/450" alt="Tropical beach boat">
        </div>

        <!-- Middle Panoramic Banner (spans all 5 columns) -->
        <div class="card banner">
            <img src="https://picsum.photos/id/1029/1400/500" alt="Sailboats at sunset">
        </div>

        <!-- Bottom Row (5 items) -->
        <div class="card">
            <img src="https://picsum.photos/id/1070/600/450" alt="Vintage truck">
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1067/600/450" alt="Stone house garden">
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1060/600/450" alt="Coffee table outdoor">
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1040/600/450" alt="Beach loungers">
        </div>
        <div class="card">
            <img src="https://picsum.photos/id/1035/600/450" alt="Balcony overlooking water">
        </div>
    </div>

</body>
</html>
