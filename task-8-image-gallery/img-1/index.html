<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="gallery-container">
        <!-- Left Column -->
        <div class="card item-1">
            <img src="https://picsum.photos/200" alt="Coastline view">
        </div>
        <div class="card item-2">
            <img src="https://picsum.photos/100" alt="Mountain stream">
        </div>

        <!-- Center Large Feature -->
        <div class="card item-main">
            <img src="https://picsum.photos/1000/1000" alt="Hiker on forest trail">
        </div>

        <!-- Right Column -->
        <div class="card item-3">
            <img src="https://picsum.photos/id/1015/600/400" alt="Bay from above">
        </div>
        <div class="card item-4">
            <img src="https://picsum.photos/id/106/600/800" alt="Red flowers by water">
        </div>

        <!-- Bottom Row (5 items) -->
        <div class="card item-b1">
            <img src="https://picsum.photos/id/1071/500/400" alt="Motorbike in street">
        </div>
        <div class="card item-b2">
            <img src="https://picsum.photos/id/1053/500/400" alt="Boat on turquoise water">
        </div>
        <div class="card item-b3">
            <img src="https://picsum.photos/id/1070/500/400" alt="Vintage truck">
        </div>
        <div class="card item-b4">
            <img src="https://picsum.photos/id/1067/500/400" alt="House with flower garden">
        </div>
        <div class="card item-b5">
            <img src="https://picsum.photos/id/1060/500/400" alt="Coffee on table">
        </div>
    </div>

</body>
</html>
