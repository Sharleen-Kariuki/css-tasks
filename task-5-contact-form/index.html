<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <main class="contact-card">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <h2 class="sidebar-title">Contact us</h2>
        <p class="sidebar-text">
          We can’t wait to hear from you. Feel free to get in touch with us.
        </p>
      </div>
      <div class="sidebar-bottom">
        <p>Happy ST</p>
        <p>000-111-222</p>
      </div>
    </aside>

    <!-- Right Form Section -->
    <section class="form-section">
      <form class="contact-form" action="#" method="post">
        
        <!-- Top Row: Two Inputs Side by Side -->
        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" required>
          </div>
        </div>

        <!-- Middle Row: Message Textarea -->
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="4" required></textarea>
        </div>

        <!-- Bottom Row: Full-width Submit Button -->
        <button type="submit" class="btn-submit">Send message</button>
      </form>
    </section>
  </main>

</body>
</html>
